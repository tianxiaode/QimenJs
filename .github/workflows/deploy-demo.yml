name: Deploy Demo

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/full-stack/**'
      - '.devcontainer/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install

      - name: Build QimenJS library
        run: npm run build

      - name: Link local packages to example
        run: node scripts/link-packages.js

      - name: Copy i18n IIFE
        run: cd examples/full-stack/client && node ../node_modules/@qimen-lab/i18n/copy.js

      - name: Build demo application
        run: cd examples/full-stack/client && npx vite build --outDir ../../../demo-dist --base /QimenJs/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
