name: Deploy Demo

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/full-stack/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: 部署静态前端到 GitHub Pages
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build OrbitJS library
        run: npm run build

      - name: Build i18n.js
        run: cd examples/full-stack/client && npx vite build --config vite.config.i18n.ts

      - name: Build demo application
        run: cd examples/full-stack/client && npx vite build --outDir ../../../demo-dist --base /orbitjs/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 2: 自动创建/重启 Codespace 用于完整演示
  start-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Create or restart Codespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          # 查找该分支上是否已有 Codespace
          EXISTING=$(gh api "user/codespaces" --jq ".codespaces[] | select(.repository.full_name==\"$REPO\") | .name" 2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            echo "Found existing Codespace: $EXISTING, restarting..."
            gh api "user/codespaces/$EXISTING/start" --method POST || true
          else
            echo "Creating new Codespace on branch: $BRANCH"
            gh api "user/codespaces" --method POST \
              -f repository_id="$(gh api "repos/$REPO" --jq '.id')" \
              -f ref="$BRANCH" \
              -f machine="basicLinux32gb" || echo "Codespace creation may need manual approval"
          fi
